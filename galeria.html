<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <style>
        @charset "UTF-8";
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap');
        @font-face {
            font-family: blood;
            src: url(bloodcrow.ttf) format(truetype);
        }
        *{
        
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root{
            --cor0:#AC99F2;
            --cor1:#9980F2;
            --cor2:#8352EB;
            --cor3:#6E1AE8;
            --cor4:#611DF2;
            --cor5:#A6937C;
            --cor6:#efe3d3;
            --cor7:#f9f5ef;
            --cor8:#8BE665;
        
        

            --font-opensans:open sans-serif;
            --fonte-karla:'Karla sans' cursive;
            --font-afacad:'Afacad flux',sans-serif;
            
        }
        @font-face {
            font-family:Flower Brownies;
            src: url(fonte/Flower\ Brownies.otf) format('opentype');
        }
        @font-face{
            font-family: star;
            src:url(fonte/Moonstar.ttf) format(truetype);
        }
        header{
            min-height: 130px;
            text-align: center;
            padding-top: 5px;
            background-color: var(--cor3);
        }
        header h1{
            font-family:star;
            font-size: 4rem;
            font-weight: 900;
            color:black;
            margin-bottom: 20px;
            
        }
        body{
            background-color: var(--cor0);
        }
        
        .galeria-contene{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 2vw;
            padding: 20px;
            padding-bottom: 50px;
        }
        .galeria-itens{
            width: 340px;
            height: 340px;
            border: 10px solid #FFF;
            box-shadow: 5px 5px 5px #0006;
            
            transition: transform .5s linear;
        }
        .galeria-itens img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .galeria-itens:hover{
            transform: scale(1.3);
        }
        .link a{
            background-color: yellowgreen;
            color: var(--cor3);
            width: 40px;
            height: 40pxpx;
            padding: 5px;
            border-radius: 2px;
            text-decoration: none;
           
        }
        .link a:hover{
            background-color: var(--cor1);
            color: white;
        }
        main{
            margin: 15px;
        }
        @media (max-width:2000px) 
        {   
        
        footer{
            background-color:var(--cor4) ;
          
        }
        footer h3{
            color: white;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding:0px;
            font-size: larger;
            width: 100%;
        
        }
        }
        .n{
            padding-top: 20px;
        }
        
        
    </style>
</head>
<body>
    <header>
        <h1>Galeria de Fotos</h1>
      
    </header>
  <div class="galeria-contene">
      
      
      
              <a href="img/ai.jpg" class="galeria-itens">
              <img src="img/ai.jpg" alt="">
              </a>
              <a href="img/img1.jpg" class="galeria-itens">
                <img src="img/img1.jpg" alt="">
              </a>
              <a href="img/img4.jpg" class="galeria-itens">
                <img src="img/img4.jpg" alt="">
              </a>
              <a href="img/img6.jpg" class="galeria-itens">
                  <img src="img/img6.jpg" alt="">
              </a>
              <a href="img/img2.jpg" class="galeria-itens">
                <img src="img/img2.jpg">
             </a>
             <a href="img/img5.jpg" class="galeria-itens">
                <img src="img/img5.jpg" alt="">
             </a>
             <a href="img/img3.jpg" class="galeria-itens">
                <img src="img/img3.jpg" alt="">
             </a>
             <a href="img/madame l.jpg" class="galeria-itens">
                <img src="img/madame l.jpg" alt="">
             </a>
    </div>
        

    <div class="link"><main><a href="conclusão.html" >Volte para página anterior</a></main></div>
    <footer>
        <h3 class="n">@2024 Raiane dos Santos</h3>
        <h3>Centro de Ensino Médio Integrado do Cruzeiro</h3>
      </footer>  
</body>
</html>
